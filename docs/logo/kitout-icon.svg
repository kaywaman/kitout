<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Kitout</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A78"/>
      <stop offset="1" stop-color="#0E8C8C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the K's stem: three stacked service blocks -->
  <g fill="#FFFFFF">
    <rect x="124" y="118" width="84" height="80" rx="18"/>
    <rect x="124" y="216" width="84" height="80" rx="18"/>
    <rect x="124" y="314" width="84" height="80" rx="18"/>
  </g>
  <!-- the K's arms: the environment fanning out from the middle block -->
  <path d="M250 256 L352 160 M250 256 L362 370" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the one click: a node launching out of the upper arm -->
  <circle cx="398" cy="118" r="34" fill="#FFB547"/>
</svg>
