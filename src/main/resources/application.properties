# ---------------------------------------------------------------------------------------------
# kitout daemon. Only reachable from this machine: see org.kitout.api.security.ApiSecurityFilter.
# ---------------------------------------------------------------------------------------------
quarkus.application.name=kitout
quarkus.http.host=127.0.0.1
quarkus.http.port=7878
%dev.quarkus.http.port=7879
%test.quarkus.http.test-port=0

# No CORS: the UI is served by the same process (same origin).
quarkus.http.cors.enabled=false

# Keep the daemon quiet; services' own logs live in ~/.local/state/kitout/logs.
quarkus.log.level=INFO
quarkus.log.category."org.kitout".level=INFO
quarkus.banner.enabled=false

# kitout's own log file, besides the terminal. Main sets the path from KitoutPaths
# (~/.local/state/kitout/kitout.log); this default is only used when Main does not run.
quarkus.log.file.enabled=true
quarkus.log.file.path=${user.home}/.local/state/kitout/kitout.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=3
%test.quarkus.log.file.enabled=false

# ---------------------------------------------------------------------------------------------
# UI (React + Vite in src/main/webui), built into the binary by Quinoa.
# In dev mode Quinoa starts Vite and proxies to it, so UI changes reload instantly.
# ---------------------------------------------------------------------------------------------
quarkus.quinoa.build-dir=dist
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.dev-server.host=127.0.0.1
# Show Vite's own output in the dev-mode console, and give a cold first start more time.
quarkus.quinoa.dev-server.logs=true
quarkus.quinoa.dev-server.check-timeout=90000
quarkus.quinoa.ignored-path-prefixes=/api,/q

# ---------------------------------------------------------------------------------------------
# OpenAPI: the contract between daemon and UI. OpenApiContractTest keeps
# src/main/webui/openapi.json in sync; the UI build generates TypeScript types from it.
# ---------------------------------------------------------------------------------------------
mp.openapi.extensions.smallrye.info.title=kitout API
mp.openapi.extensions.smallrye.info.version=1
quarkus.smallrye-openapi.info-description=Local API of the kitout daemon. Requires the X-Kitout-Token header.
quarkus.swagger-ui.always-include=false

# Tests exercise the API only; the UI has its own tests (npm test).
%test.quarkus.quinoa.enabled=false

# the team file starter kit that "kitout team init" writes
quarkus.native.resources.includes=team/**

# Where the team file is, followed on the first call (empty: each developer enters it in Setup).
# Named like a compose file in the team file: the repository and the file's path in it.
# Also as environment variables: KITOUT_TEAM_HOST, KITOUT_TEAM_REPO, KITOUT_TEAM_PATH, KITOUT_TEAM_REF.
# kitout.team.host=gitlab.example.com
# kitout.team.repo=acme/platform/infrastructure
# kitout.team.path=kitout/kitout-team.json
# kitout.team.ref=main
#   host: empty means the GitLab host in each developer's settings; path: empty means kitout-team.json;
#   ref: empty means main. The older single link (kitout.team.location, KITOUT_TEAM_LOCATION) is still read
#   when no repo is set.
# true: every developer must follow the team file above; the "Build a team setup" option is not offered.
kitout.team.required=false
